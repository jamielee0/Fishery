# Trees to Seas – Conda environment
# Usage: conda env create -f environment.yml
name: trees-to-seas
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pandas>=2.1
  - numpy>=1.26
  - xarray>=2024.1
  - scipy>=1.12
  - scikit-learn>=1.4
  - statsmodels>=0.14
  - matplotlib>=3.8
  - seaborn>=0.13
  - geopandas>=0.14
  - shapely>=2.0
  - pyyaml>=6.0
  - requests>=2.31
  - tqdm>=4.66
  - pytest>=8.0
  - ruff>=0.3
  - jupyter
  - pip
  - pip:
    - lightgbm>=4.3
    - xgboost>=2.0
