[project]
name = "trees-to-seas"
version = "0.1.0"
description = "Dynamic estuarine habitat and fishery risk modeling – NC proof-of-concept"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "xarray>=2024.1",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "pre-commit>=3.6",
    "jupyter>=1.0",
]
ml = [
    "lightgbm>=4.3",
    "xgboost>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
