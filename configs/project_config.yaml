# --- Focal Species & Targets (LOCKED) ---
focal_species:

  - name: "Blue crab"
    scientific_name: "Callinectes sapidus"
    type: "mobile_crustacean"
    status: "LOCKED"
    response_variable: null  # PENDING: Approve (likely standardized CPUE from fishery-independent survey)
    hypothesis_roles: ["H1", "H2"]
    trait_table: "01_literature_map/trait_tables/blue_crab.md"
    healthy_ranges:
      # All thresholds require literature sign-off before feature engineering (DEC-005)
      temperature_c: [null, null]    # PENDING: literature
      salinity_psu: [null, null]     # PENDING: literature
      dissolved_oxygen_mg_l: [null, null]  # PENDING: literature (commonly cited ~2.0-3.0 mg/L)
    degree_day_base_c: null  # PENDING: literature
    primary_compression_mechanism: "hypoxia-temperature squeeze"
    depth_policy: "bottom_required"

  - name: "Eastern oyster"
    scientific_name: "Crassostrea virginica"
    type: "sessile_bivalve"
    status: "LOCKED"
    response_variable: null  # PENDING: Approve (likely live density or condition metric)
    hypothesis_roles: ["H1", "H3"]
    trait_table: "01_literature_map/trait_tables/eastern_oyster.md"
    healthy_ranges:
      temperature_c: [null, null]    # PENDING: literature
      salinity_psu: [null, null]     # PENDING: literature — upper bound complicated by Dermo disease
      dissolved_oxygen_mg_l: [null, null]  # PENDING: literature
    degree_day_base_c: null  # Expected low relevance
    primary_compression_mechanism: "osmotic stress from freshening"
    depth_policy: "bottom_required"
    known_confounders:
      - "Perkinsus marinus (Dermo) disease at high salinity + high temperature"
      - "Sedimentation/burial (DEFERRED with B2)"

  - name: "Southern Flounder"
    scientific_name: "Paralichthys lethostigma"
    type: "southern_flounder"
    status: "LOCKED"
    selection_rationale: "Benthic, heavily surveyed by NCDMF, textbook hypoxia avoidance"
    response_variable: null  # PENDING: Approve
    hypothesis_roles: ["H1", "H2"]
    trait_table: "01_literature_map/trait_tables/southern_flounder.md"
    healthy_ranges:
      temperature_c: [null, null]    # PENDING: literature
      salinity_psu: [null, null]     # PENDING: literature
      dissolved_oxygen_mg_l: [null, null]  # PENDING: literature
    degree_day_base_c: null  # PENDING: literature
    primary_compression_mechanism: "hypoxia-temperature squeeze"
    depth_policy: "bottom_required"

  - name: "Seagrass / SAV"
    scientific_name: null  # PENDING: Day 3 species selection (Zostera marina vs. Halodule wrightii)
    type: "habitat_indicator"
    status: "LOCKED"  # Role locked; exact species is a Day 3 decision
    indicator_resolution: "annual_or_episodic"
    indicator_note: >
      SAV is an annual/episodic habitat indicator, not an event-scale target
      on par with the mobile species. Official NC SAV monitoring relies on
      infrequent multi-year mapping products. Event-scale attribution of
      compression to SAV loss is unlikely to be defensible in v1.
    species_decision_note: >
      Zostera marina gives the strongest thermal-limit story but may have limited
      NC coverage. Halodule wrightii is more thermally tolerant with potentially
      better coverage. Thresholds differ dramatically — species choice must be made
      before literature thresholds are set.
    response_variable: null  # PENDING: Approve (likely mapped extent or presence/absence)
    hypothesis_roles: ["H1"]
    trait_table: "01_literature_map/trait_tables/seagrass_sav.md"
    healthy_ranges:
      temperature_c: [null, null]    # PENDING: literature (species-dependent)
      salinity_psu: [null, null]     # PENDING: literature
      turbidity_ntu: [null, null]    # PENDING: literature
      light_par: [null, null]        # PENDING: literature
    degree_day_base_c: null  # Expected low relevance
    primary_compression_mechanism: "thermal limits and light limitation"
    depth_policy: "shallow_benthic"

# --- Variable Classification (LOCKED: DEC-006) ---
# Strict staging per ontology — do not mix families in kitchen-sink models
variable_families:
  forcing:
    description: "External watershed and weather drivers"
    modeling_rule: "Use mainly upstream of local state models for H3"
    approved_variables:
      - "basin_precipitation"
      - "river_discharge"
      - "air_temperature"
    useful_variables:
      - "wind_speed_direction"

  local_estuarine_state:
    description: "Direct environmental conditions organisms experience"
    modeling_rule: "Main explanatory layer for H1"
    approved_variables:
      - "bottom_water_temperature"
      - "bottom_salinity"
      - "bottom_dissolved_oxygen"
      - "turbidity_clarity"  # Essential for SAV, useful otherwise
    useful_variables:
      - "stratification_metric"  # If paired-depth data available

  habitat_condition:
    description: "Physical context that shapes exposure severity"
    modeling_rule: "Use as modifiers/context, not as substitutes for state"
    approved_variables:
      - "bathymetry_depth"
    useful_variables:
      - "benthic_habitat_substrate"
      - "estuarine_position"

  engineered_features:
    description: "Literature-backed summaries of exposure through time/space"
    modeling_rule: "Main H2 layer; secondary support for H1/B1"
    approved_variables:
      - "daily_healthy_unsafe_status"
      - "consecutive_unsafe_days"
      - "habitat_days_in_healthy_range"
      - "hypoxia_duration_metric"
    useful_variables:
      - "salinity_excursion_metric"
      - "heat_event_metric"
      - "degree_days"
      - "habitat_compression_temporal"

  benchmark:
    description: "Intentionally simple static or survey-timed covariates"
    modeling_rule: "Use only in baseline models testing the central claim"
    variables:
      - "calendar_week_season"
      - "static_zone_grid_id"
      - "annual_seasonal_mean_state"
      - "same_day_survey_snapshot"

