# ============================================================================
# Data Source Registry — Trees to Seas v1 (Day 3 Update)
# ============================================================================
# Updated 2026-04-08 based on Day 3 desktop research.
# Access status reflects domain knowledge assessment — no downloads tested.
#
# Status tags:
#   CONFIRMED       — source known to exist from established programs
#   UNCONFIRMED     — plausible but not verified by direct access
#   SURFACE_ONLY    — confirmed limitation on measurement depth
#   BLOCKED         — cannot proceed without human action
#   REQUEST_ONLY    — requires formal data request (not public download)
# ============================================================================

