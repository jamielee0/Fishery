    measurement_depth: "SURFACE_ONLY (~1-1.5m intake depth)"
    measurement_depth_confidence: "HIGH"
    format: null
    access_status: "UNCONFIRMED"
    credentials_needed: null
    blockers: |
      CRITICAL: Surface-only measurements violate DEC-007 for benthic taxa.
      FerryMon CANNOT serve as the primary bottom-data source for blue crab,
      oyster, or Southern Flounder models.
    blocker_severity: "HIGH"
    notes: |
      FerryMon uses a flow-through system on NC DOT ferries. Valuable for
      surface state and turbidity/clarity (SAV pathway), and for spatial
      transect coverage of open Pamlico Sound. But the surface-only limitation
      is a hard constraint for DEC-007 compliance.
    day3_finding: "Surface-only confirmed. Variable ontology incorrectly lists FerryMon as a bottom-data source."
    day3_action: "HUMAN: Confirm access URL. This source remains valuable for surface state and turbidity even though it cannot satisfy DEC-007."

