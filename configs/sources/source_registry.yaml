      Halodule wrightii) cannot proceed without knowing campaign dates and
      species-level coverage.
    blocker_severity: "HIGH"
    sav_species_notes: |
      Primary NC species: Halodule wrightii (shoalgrass — widespread, thermally
      tolerant), Zostera marina (eelgrass — near inlets, at southern range limit,
      declining), Ruppia maritima (widgeongrass — lower salinity areas).
      Preliminary recommendation: H. wrightii for pragmatic NC coverage.
      Z. marina gives stronger thermal-limit story but may have very limited
      current extent in Pamlico Sound.
    day3_action: "HUMAN: Identify SAV campaign dates and download source. Confirm Pamlico Sound coverage. This blocks species selection."

